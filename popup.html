<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minimal YouTube</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="wrap">
    <header class="hero">
      <img class="logo" src="icons/icon48.png" alt="" width="40" height="40" />
      <div>
        <h1>Minimal YouTube</h1>
        <p class="version" id="version"></p>
      </div>
    </header>

    <section class="card">
      <div class="row">
        <div class="row-text">
          <span class="label" id="switch-label">Search-only Home page</span>
          <span class="desc" id="switch-desc">Replaces the Home feed with a search box.</span>
        </div>
        <button id="switch" class="switch" type="button" role="switch" aria-checked="true"
          aria-labelledby="switch-label" aria-describedby="switch-desc">
          <span class="knob"></span>
        </button>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>

    <footer class="foot">
      <a href="https://github.com/AbdullahAlmatrfi/youtube-focus-mode/issues" target="_blank"
        rel="noopener noreferrer">Report a problem</a>
      <a href="https://github.com/AbdullahAlmatrfi/youtube-focus-mode/blob/main/docs/privacy-policy.md"
        target="_blank" rel="noopener noreferrer">Privacy policy</a>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>

</html>
