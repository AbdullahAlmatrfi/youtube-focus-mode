<div id="myt-overlay" role="main" aria-label="Minimal YouTube">

  <!-- LOGO: two separate elements so they can never overlap -->
  <div id="myt-logo">
    <div id="myt-logo-inner">
      <svg id="myt-badge" viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="0" y="0" width="68" height="48" rx="14" fill="#FF0000" />
        <polygon points="26,13 26,35 46,24" fill="white" />
      </svg>
      <span id="myt-wordmark">YouTube</span>
    </div>
  </div>

  <!-- Time-based greeting (filled by content.js) -->
  <div id="myt-greet"></div>

  <!-- SEARCH -->
  <div id="myt-search-wrapper">
    <div id="myt-search-box">
      <input id="myt-search" type="text" dir="auto" placeholder="Search YouTube…" autocomplete="off"
        spellcheck="false" role="combobox" aria-label="Search YouTube" aria-autocomplete="list"
        aria-expanded="false" aria-controls="myt-suggestions" />
      <div id="myt-search-actions">
        <button id="myt-history-btn" type="button" aria-label="Recent searches" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3v5h5" />
            <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8" />
            <path d="M12 7v5l3 2" />
          </svg>
        </button>
        <span class="myt-sep" aria-hidden="true"></span>
        <button id="myt-search-btn" type="button" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <line x1="16.5" y1="16.5" x2="22" y2="22" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Live search suggestions (and quick actions) -->
    <ul id="myt-suggestions" role="listbox" aria-label="Search suggestions"></ul>

    <!-- Recent searches, opened by the history button -->
    <div id="myt-recent" role="listbox" aria-label="Recent searches" hidden></div>

    <div id="myt-status" role="status" aria-live="polite"></div>
  </div>

  <!-- Spacer pushes the explore button lower in the page -->
  <div id="myt-spacer"></div>

  <div id="myt-explore-wrapper">
    <button id="myt-explore-btn" type="button"><span aria-hidden="true">↓</span> Explore Feed</button>
  </div>

</div>
